<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Valve Repair ITP – Environmental Fittings</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#1a3a5c;--accent:#e8740a;--bg:#eef1f4;--card:#fff;
  --border:#d0d7de;--text:#1c2b3a;--muted:#6b7c8d;
  --pass:#1a7f37;--fail:#cf222e;--warn:#9a6700;--hp:#7c3aed;--r:7px;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
  height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── HEADER ── */
header{height:48px;background:var(--brand);color:#fff;padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:100}
.logo{font-size:.98rem;font-weight:700;white-space:nowrap}.logo span{color:var(--accent)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:5px;
  font-size:.77rem;font-weight:600;cursor:pointer;border:2px solid transparent;transition:.12s;line-height:1;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#c9620a}
.btn-outline{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}.btn-outline:hover{background:rgba(255,255,255,.1)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}.btn-ghost:hover{background:var(--bg)}
.btn-danger{background:var(--fail);color:#fff}.btn-danger:hover{background:#a81820}
.btn-sm{padding:4px 9px;font-size:.73rem}

/* ── SHELL ── */
.shell{display:grid;grid-template-columns:200px 1fr;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-top{padding:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-top h2{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:7px}
.job-list{flex:1;overflow-y:auto;padding:7px}
.jcard{border:1px solid var(--border);border-radius:6px;padding:9px;cursor:pointer;transition:.12s;margin-bottom:6px}
.jcard:hover{border-color:var(--brand)}.jcard.active{border-color:var(--accent);background:#fff8f2}
.jt{font-weight:700;font-size:.82rem}.jm{font-size:.69rem;color:var(--muted);margin-top:2px}
.badge{display:inline-block;padding:2px 6px;border-radius:20px;font-size:.63rem;font-weight:700}
.b-bld{background:#fff8c5;color:var(--warn)}.b-open{background:#ddf4ff;color:#0969da}
.b-act{background:#e6f0ff;color:#0550ae}.b-done{background:#dafbe1;color:var(--pass)}.b-attn{background:#ffebe9;color:var(--fail)}

/* ── WORK AREA ── */
.work-area{display:flex;flex-direction:column;overflow:hidden}
.job-bar{background:var(--card);border-bottom:1px solid var(--border);padding:8px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;flex-wrap:wrap}
.jb-title{font-size:.98rem;font-weight:800}.jb-meta{font-size:.71rem;color:var(--muted)}

/* ── SPLIT ── */
.split{display:grid;grid-template-columns:1fr 1fr;flex:1;overflow:hidden}
.panel{display:flex;flex-direction:column;overflow:hidden}
.panel-left{border-right:2px solid var(--border)}
.panel-hdr{padding:9px 13px;display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.panel-hdr h3{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ph-count{font-size:.75rem;font-weight:700;color:var(--accent)}
.panel-body{flex:1;overflow-y:auto;padding:9px}

/* ══════════════════════════════════════
   LEFT — SCOPE BUILDER
══════════════════════════════════════ */
.lib-sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:8px;overflow:hidden}
.lib-sec-hdr{background:#2c527a;color:#fff;padding:7px 11px;
  display:flex;align-items:center;justify-content:space-between;gap:6px}
.lib-sec-hdr h4{font-size:.8rem;font-weight:700;flex:1}
.lib-sec-hdr .lshr{display:flex;align-items:center;gap:5px;font-size:.67rem;opacity:.82}
.sel-all{padding:2px 7px;border-radius:4px;font-size:.66rem;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff}
.sel-all:hover{background:rgba(255,255,255,.28)}

/* ITEM ROW */
.lib-item{border-bottom:1px solid var(--border);transition:background .1s}
.lib-item:last-of-type{border-bottom:none}
.lib-item.sel{background:#f6fdf8}
.lib-item-top{display:flex;align-items:stretch;cursor:pointer;min-height:40px}
.lib-item-top:hover{background:#f0f4f7}
.lib-item.sel .lib-item-top:hover{background:#edfbf2}

.cb-cell{width:36px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;border-right:1px solid var(--border)}
.cb{width:17px;height:17px;border-radius:4px;border:2px solid var(--border);background:#fff;
  display:flex;align-items:center;justify-content:center;transition:.12s;flex-shrink:0}
.lib-item.sel .cb{background:var(--pass);border-color:var(--pass)}
.lib-item.sel .cb::after{content:'✓';color:#fff;font-size:.72rem;font-weight:700}
.lib-item-top:hover .cb{border-color:#8a9cb0}

.lib-item-name{padding:7px 9px;flex:1}
.lin{font-size:.8rem;line-height:1.3}.lref{font-size:.62rem;color:var(--muted)}

/* ATTRIBUTES BAR — shows when item is selected */
.attr-bar{padding:5px 9px 7px 36px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;
  border-top:1px dashed var(--border);background:#f0fdf4}
.attr-toggle{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:20px;
  font-size:.67rem;font-weight:700;cursor:pointer;border:1.5px solid var(--border);
  background:#fff;color:var(--muted);transition:.12s;white-space:nowrap;user-select:none}
.attr-toggle:hover{border-color:#8a9cb0;color:var(--text)}
.attr-toggle.on{color:#fff;border-color:transparent}
.attr-toggle.hp.on  {background:var(--hp)}
.attr-toggle.bef.on {background:#0550ae}
.attr-toggle.aft.on {background:#0969da}
.attr-toggle.ver.on {background:var(--warn);color:#fff}
.attr-toggle .atcb{width:12px;height:12px;border-radius:2px;border:1.5px solid currentColor;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.attr-toggle.on .atcb::after{content:'✓';font-size:.6rem;font-weight:700}

/* SUB-REQS */
.sub-reqs-area{padding:0 9px 7px 36px;background:#f6fdf8}
.sub-req-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.sub-req-row span{font-size:.75rem;flex:1;color:var(--text)}
.sr-del{width:18px;height:18px;border-radius:3px;border:none;background:transparent;
  cursor:pointer;font-size:.7rem;color:var(--muted);display:flex;align-items:center;justify-content:center}
.sr-del:hover{background:#ffecec;color:var(--fail)}
.add-sr-row{display:flex;gap:5px;margin-top:5px;align-items:center}
.add-sr-inp{flex:1;border:1px solid var(--border);border-radius:4px;
  padding:3px 7px;font-size:.75rem;background:#fff;font-family:inherit}
.add-sr-inp:focus{outline:none;border-color:var(--accent)}
.add-sr-btn{padding:3px 8px;border-radius:4px;font-size:.7rem;font-weight:700;cursor:pointer;
  background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.add-sr-btn:hover{background:#fff5ee}

/* add custom item */
.add-row{padding:6px 9px;display:flex;gap:5px;border-top:1px dashed var(--border)}
.add-inp{flex:1;border:1px solid var(--border);border-radius:4px;
  padding:4px 7px;font-size:.77rem;background:#fafbfc;font-family:inherit}
.add-inp:focus{outline:none;border-color:var(--accent)}
.add-btn{padding:3px 9px;border-radius:4px;font-size:.72rem;font-weight:700;cursor:pointer;
  background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.add-btn:hover{background:#fff5ee}

/* ══════════════════════════════════════
   RIGHT — ITP CHECKLIST
══════════════════════════════════════ */
.itp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:10px;color:var(--muted);text-align:center;padding:20px}

/* summary */
.itp-summary{display:flex;gap:0;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--card)}
.ss{flex:1;text-align:center;padding:7px 4px;border-right:1px solid var(--border)}
.ss:last-child{border-right:none}
.ss .sv{font-size:1.15rem;font-weight:800}.ss .sl{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.c-pass{color:var(--pass)}.c-fail{color:var(--fail)}.c-warn{color:var(--warn)}.c-hp{color:var(--hp)}
.pbar-strip{height:4px;background:var(--border);flex-shrink:0}
.pbar-fill{height:100%;transition:.3s}

/* itp section */
.itp-sec{margin-bottom:9px}
.itp-sec-hdr{background:var(--brand);color:#fff;padding:7px 11px;border-radius:6px 6px 0 0;
  display:flex;align-items:center;justify-content:space-between}
.itp-sec-hdr h4{font-size:.78rem;font-weight:700}.isp{font-size:.67rem;opacity:.75}

/* exec row */
.exec-row{background:var(--card);border-left:1px solid var(--border);
  border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.exec-row:last-child{border-radius:0 0 6px 6px;overflow:hidden}
.exec-row.done{background:#f0fdf4}.exec-row.flagged{background:#fff5f5}

/* HOLD POINT ROW */
.exec-row.hold-point{border-left:3px solid var(--hp)}

.exec-top{display:grid;grid-template-columns:34px 1fr 60px;align-items:stretch;min-height:42px}
.exec-cb{display:flex;align-items:flex-start;justify-content:center;padding-top:11px;
  border-right:1px solid var(--border);cursor:pointer;flex-shrink:0}
.exec-body{padding:7px 9px;display:flex;flex-direction:column;gap:2px;min-width:0}
.en{font-size:.79rem;font-weight:500;line-height:1.3;display:flex;align-items:flex-start;gap:5px;flex-wrap:wrap}
.er{font-size:.61rem;color:var(--muted)}

/* attribute badges on ITP */
.hp-badge{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:20px;
  background:var(--hp);color:#fff;font-size:.62rem;font-weight:700;white-space:nowrap;flex-shrink:0}
.attr-badge{display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:20px;
  font-size:.61rem;font-weight:700;white-space:nowrap;flex-shrink:0}
.attr-badge.bef{background:#ddeeff;color:#0550ae}
.attr-badge.aft{background:#ddeeff;color:#0969da}
.attr-badge.ver{background:#fff3cd;color:var(--warn)}

/* measurement fields */
.meas-fields{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:4px}
.meas-fields.one{grid-template-columns:1fr}
.mf-wrap label{display:block;font-size:.61rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.meas-inp{width:100%;border:1px solid var(--border);border-radius:4px;
  padding:3px 7px;font-size:.75rem;background:#fafbfc;font-family:inherit}
.meas-inp:focus{outline:none;border-color:var(--accent)}
.meas-inp.verify{border-color:var(--warn);background:#fffdf0}

.enote{border:none;border-bottom:1px dashed var(--border);background:transparent;
  font-size:.72rem;color:var(--muted);width:100%;padding:2px 0;font-family:inherit;margin-top:3px}
.enote:focus{outline:none;border-bottom-color:var(--accent);color:var(--text)}
.enote::placeholder{color:#c5d0db}

.exec-acts{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:0 7px;border-left:1px solid var(--border)}
.flag-btn{width:24px;height:24px;border-radius:4px;border:1.5px solid var(--border);
  background:transparent;cursor:pointer;font-size:.76rem;display:flex;align-items:center;
  justify-content:center;transition:.12s;color:var(--muted)}
.flag-btn:hover{border-color:var(--fail);color:var(--fail)}
.exec-row.flagged .flag-btn{background:var(--fail);border-color:var(--fail);color:#fff}
.rm-btn{width:20px;height:20px;border-radius:4px;border:none;background:transparent;
  cursor:pointer;font-size:.72rem;color:var(--muted);display:flex;align-items:center;justify-content:center}
.rm-btn:hover{background:#ffecec;color:var(--fail)}

/* sub-req items in exec */
.exec-subreqs{padding:4px 9px 7px 34px;background:inherit;border-top:1px dashed var(--border)}
.exec-sr-row{display:flex;align-items:center;gap:6px;padding:3px 0;
  border-bottom:1px dotted var(--border)}
.exec-sr-row:last-child{border-bottom:none}
.exec-sr-row .srcb{cursor:pointer}
.exec-sr-row span{font-size:.74rem;flex:1}
.exec-sr-row .done-text{text-decoration:line-through;color:var(--muted)}

/* HOLD POINT divider */
.hp-divider{background:#7c3aed;color:#fff;padding:4px 9px 4px 11px;
  display:flex;align-items:center;gap:6px;font-size:.68rem;font-weight:700;letter-spacing:.04em}
.hp-divider::before{content:'🔴';font-size:.8rem}

/* sign-off */
.signoff{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:12px;margin-top:9px}
.signoff h4{font-size:.78rem;font-weight:700;margin-bottom:9px;
  border-bottom:1px solid var(--border);padding-bottom:6px}
.so-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sof label{display:block;font-size:.62rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.sof input{width:100%;border:1px solid var(--border);border-radius:4px;
  padding:4px 7px;font-size:.78rem;background:#fafbfc;font-family:inherit}
.sof input:focus{outline:none;border-color:var(--accent)}
.sig-line{border-bottom:2px solid var(--border);height:28px}

/* job details */
.job-details{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:10px;margin-bottom:9px}
.jd-hdr{font-size:.76rem;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;cursor:pointer;display:flex;align-items:center;gap:4px;margin-bottom:8px}
.jd-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.jdf label{display:block;font-size:.62rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.jdf input,.jdf select,.jdf textarea{width:100%;border:1px solid var(--border);border-radius:4px;
  padding:4px 7px;font-size:.77rem;background:#fafbfc;font-family:inherit}
.jdf input:focus,.jdf select:focus,.jdf textarea:focus{outline:none;border-color:var(--accent)}
.jdf.s2{grid-column:span 2}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.52);display:flex;align-items:center;
  justify-content:center;z-index:500;padding:14px}
.overlay.hidden{display:none}
.modal{background:var(--card);border-radius:11px;padding:20px;width:100%;max-width:520px;
  box-shadow:0 16px 48px rgba(0,0,0,.28);max-height:92vh;overflow-y:auto}
.modal h2{font-size:1rem;font-weight:700;margin-bottom:13px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.mf label{display:block;font-size:.68rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;margin-bottom:3px}
.mf input,.mf select,.mf textarea{width:100%;border:1px solid var(--border);border-radius:5px;
  padding:5px 8px;font-size:.81rem;background:#fafbfc;font-family:inherit}
.mf input:focus,.mf select:focus,.mf textarea:focus{outline:none;border-color:var(--accent)}
.mf.s2{grid-column:span 2}
.mact{display:flex;justify-content:flex-end;gap:7px}
.tmpl-note{grid-column:span 2;font-size:.71rem;color:var(--muted);background:#f0fdf4;
  border:1px solid #c6efd0;border-radius:5px;padding:6px 9px;line-height:1.4}

@media(max-width:900px){
  .split{grid-template-columns:1fr}
  .panel-left{border-right:none;border-bottom:2px solid var(--border);max-height:50vh}
}
@media(max-width:620px){.shell{grid-template-columns:1fr}.sidebar{display:none}}

@media print{
  header,.sidebar,.panel-left,.job-bar .btn,.exec-acts,.attr-bar,.sub-reqs-area,.add-row,.add-sr-row,.sel-all{display:none!important}
  body{height:auto;overflow:visible}
  .shell{grid-template-columns:1fr;overflow:visible}
  .work-area,.split,.panel,.panel-body{overflow:visible}
  .itp-sec-hdr{background:var(--brand)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .exec-row{break-inside:avoid}
  .hp-divider{background:#7c3aed!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header>
  <div class="logo">Environmental <span>Fittings</span> — Valve Repair ITP</div>
  <div style="display:flex;gap:7px">
    <button class="btn btn-outline btn-sm" onclick="openModal()">+ New Job</button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar">
    <div class="sb-top">
      <h2>Work Orders</h2>
      <button class="btn btn-primary btn-sm" style="width:100%" onclick="openModal()">+ New Job</button>
    </div>
    <div class="job-list" id="job-list"><p style="font-size:.73rem;color:var(--muted);padding:3px">No jobs yet.</p></div>
  </aside>

  <div class="work-area" id="work-area">
    <div style="display:flex;align-items:center;justify-content:center;flex:1;color:var(--muted);flex-direction:column;gap:10px">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".22">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/>
      </svg>
      <p style="font-size:.88rem">Create a work order to get started.</p>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay hidden" id="modal" onclick="overlayClick(event)">
  <div class="modal">
    <h2>New Work Order</h2>
    <div class="mgrid">
      <div class="mf"><label>Work Order #</label><input id="f-wo" placeholder="WO-2026-001"/></div>
      <div class="mf"><label>Date Received</label><input type="date" id="f-date"/></div>
      <div class="mf"><label>Customer</label><input id="f-cust" placeholder="Company name"/></div>
      <div class="mf"><label>PO Number</label><input id="f-po" placeholder="PO-XXXXX"/></div>
      <div class="mf"><label>Valve Tag / ID</label><input id="f-tag" placeholder="V-101"/></div>
      <div class="mf"><label>Size / Class</label><input id="f-size" placeholder='2" / 900# ANSI'/></div>

      <!-- Job Type — full width -->
      <div class="mf s2">
        <label>Job Type</label>
        <select id="f-jobtype" onchange="toggleValveTypeRow(this.value)">
          <option value="">— Select job type —</option>
          <option value="repair">Repair</option>
          <option value="testonly">Test Only</option>
          <option value="manufacturing">Manufacturing</option>
          <option value="other">Other</option>
        </select>
      </div>

      <!-- Valve Type — shown for Repair / Test Only -->
      <div class="mf s2" id="vt-row" style="display:none">
        <label>Valve Type</label>
        <select id="f-valvetype">
          <option value="">— Select valve type —</option>
          <optgroup label="Ball &amp; Rotary">
            <option>4-Way Diverter Valve</option>
            <option>Ball Valve</option>
            <option>Delayed Coker Ball</option>
            <option>Delayed Coker Isolation Ball</option>
            <option>Delayed Coker Switch</option>
            <option>Orbit</option>
            <option>Twinseal</option>
            <option>Wedgeplug</option>
            <option>6-Way Transfer Valve</option>
          </optgroup>
          <optgroup label="Gate">
            <option>Gate</option>
            <option>Knife Gate</option>
            <option>Mud Valve</option>
            <option>Pipeline Gate-Slab</option>
            <option>Pipeline Gate-Expanding</option>
            <option>Pressure Seal Gate</option>
            <option>Wedge Gate</option>
          </optgroup>
          <optgroup label="Globe">
            <option>Angle Globe</option>
            <option>Globe</option>
            <option>Pressure Seal Globe</option>
          </optgroup>
          <optgroup label="Check">
            <option>ARC</option>
            <option>Ball Check</option>
            <option>Check</option>
            <option>Duo Check</option>
            <option>Piston Check</option>
            <option>Swing Check</option>
          </optgroup>
          <optgroup label="Control &amp; Specialty">
            <option>Butterfly</option>
            <option>Control Valve</option>
            <option>Everlast</option>
            <option>Mixer</option>
            <option>Pinch</option>
            <option>Relief Valve</option>
            <option>Safety Valve</option>
          </optgroup>
          <optgroup label="Plug">
            <option>Lubricated Plug</option>
            <option>Non-Lubricated Plug</option>
          </optgroup>
          <optgroup label="Other">
            <option>Actuator</option>
            <option>Manufacture/Machine/Weld</option>
          </optgroup>
        </select>
      </div>

      <div class="mf s2" id="tmpl-note-row" style="display:none">

function getTemplateKey(jobType, valveType){
  if(!jobType||jobType==='other') return 'other';
  if(jobType==='manufacturing') return 'manufacturing';
  const fam=valveFamily(valveType);
  if(jobType==='repair'){
    const k='repair:'+fam;
    return TEMPLATES[k]?k:'repair:general';
  }
  if(jobType==='testonly'){
    if(fam==='relief') return 'testonly:relief';
    if(fam==='control') return 'testonly:control';
    return 'testonly:standard';
  }
  return 'other';
}

function applyTemplate(j){
  const key=getTemplateKey(j.jobType, j.valveType);
  const ids=TEMPLATES[key]||[];
  ids.forEach(itemId=>{
    if(!j.sel[itemId]) j.sel[itemId]=defSel();
    j.sel[itemId].included=true;
    // auto-populate defaultSubReqs
    let libItem=null;
    LIB.forEach(sec=>sec.items.forEach(it=>{ if(it.id===itemId) libItem=it; }));
    if(libItem&&libItem.defaultSubReqs&&j.sel[itemId].subReqs.length===0){
      j.sel[itemId].subReqs=[...libItem.defaultSubReqs];
    }
  });
}

let jobs=JSON.parse(localStorage.getItem('itp_v5')||'[]');
let active=null;

function save(){ localStorage.setItem('itp_v5', JSON.stringify(jobs)); }
function J(){ return jobs.find(j=>j.id===active); }

function defSel(){ return {included:false,holdPoint:false,beforeMeas:false,afterMeas:false,measVerify:false,subReqs:[]}; }
function getSel(j,id){ return j.sel[id]||defSel(); }
function getExec(j,id){ return j.exec[id]||{done:false,flagged:false,notes:'',beforeVal:'',afterVal:'',verifyVal:'',subDone:{}}; }
function isIncluded(j,id){ return getSel(j,id).included; }

function allScopeItems(j){
  const out=[];
  LIB.forEach(sec=>{
    sec.items.forEach(it=>{ if(isIncluded(j,it.id)) out.push({...it,secId:sec.id,secTitle:sec.title,...getSel(j,it.id),custom:false}); });
    (j.custom||[]).filter(c=>c.secId===sec.id).forEach(c=>{
      out.push({id:c.id,name:c.name,ref:'Custom',secId:sec.id,secTitle:sec.title,...getSel(j,c.id),custom:true});
    });
  });
  return out;
}

function scopeCount(j){ return allScopeItems(j).length; }

function execStats(j){
  const items=allScopeItems(j);
  let done=0,flagged=0,holdPts=0,total=0;
  items.forEach(it=>{
    const ex=getExec(j,it.id);
    total++;
    if(ex.done) done++;
    if(ex.flagged) flagged++;
    if(it.holdPoint) holdPts++;
  });
  const pct=total?Math.round(done/total*100):0;
  return {total,done,flagged,open:total-done,holdPts,pct};
}

  document.getElementById('vt-row').style.display=show?'':'none';
  document.getElementById('tmpl-note-row').style.display=jt?'':'none';
  if(jt==='manufacturing'){
    document.getElementById('tmpl-note').textContent='✅ Manufacturing template will be applied — material receiving, machining, NDT, testing, and final inspection items pre-selected.';
  } else if(jt==='other'){
    document.getElementById('tmpl-note').textContent='ℹ️ Other — no template applied. Build the scope manually from the library.';
  } else if(show){
    document.getElementById('tmpl-note').textContent='✅ A template will be applied based on valve type. All items are editable after creation.';
  }
}

function openModal(){
  document.getElementById('f-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('f-wo').value='WO-'+new Date().getFullYear()+'-'+String(jobs.length+1).padStart(3,'0');
  document.getElementById('f-jobtype').value='';
  document.getElementById('f-valvetype').value='';
  document.getElementById('vt-row').style.display='none';
  document.getElementById('tmpl-note-row').style.display='none';
  document.getElementById('modal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('f-cust').focus(),50);
}
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
function overlayClick(e){ if(e.target.id==='modal') closeModal(); }
function g(id){ return document.getElementById(id).value.trim(); }

function createJob(){
  const jobType=g('f-jobtype');
  const valveType=g('f-valvetype');
  const j={
    id:String(Date.now()),
    wo:g('f-wo'), customer:g('f-cust'), po:g('f-po'), tag:g('f-tag'),
    jobType, valveType,
    size:g('f-size'), material:g('f-mat'), scope:g('f-scope'), date:g('f-date'),
    inspector:'', inspDate:'', qcMgr:'', qcDate:'',
    sel:{}, custom:[], exec:{}
  };
  applyTemplate(j);
  jobs.unshift(j); save(); closeModal();
  ['f-wo','f-cust','f-po','f-tag','f-size','f-mat','f-scope'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('f-jobtype').value='';
  document.getElementById('f-valvetype').value='';
  renderSidebar(); loadJob(j.id);
}

// ════════════════════════════════════════
// SIDEBAR
// ════════════════════════════════════════
function renderSidebar(){
  const el=document.getElementById('job-list');
  if(!jobs.length){ el.innerHTML='<p style="font-size:.73rem;color:var(--muted);padding:3px">No jobs yet.</p>'; return; }
  el.innerHTML=jobs.map(j=>{
    const sc=scopeCount(j), es=execStats(j);
    let badge,bc;
    if(sc===0){badge='Building';bc='b-bld';}
    else if(es.flagged>0){badge='Attention';bc='b-attn';}
    else if(es.done===es.total&&es.total>0){badge='Complete';bc='b-done';}
    else if(es.done>0){badge='Active';bc='b-act';}
    else{badge='Scoped';bc='b-open';}
    const vtLine=j.valveType||j.type||'';
    return `<div class="jcard${active===j.id?' active':''}" onclick="loadJob('${j.id}')">
      <div class="jt">${e(j.wo)}</div>
      <div class="jm">${e(j.customer)||'—'}${j.tag?' · '+e(j.tag):''}</div>
      ${vtLine||j.jobType?`<div class="jm" style="margin-top:3px;display:flex;align-items:center;gap:4px;flex-wrap:wrap">
        ${jtBadge(j.jobType,true)}
        ${vtLine?`<span style="font-size:.63rem;color:var(--muted)">${e(vtLine)}</span>`:''}
      </div>`:''}
      <div class="jm" style="margin-top:5px;display:flex;align-items:center;gap:5px">
        <span class="badge ${bc}">${badge}</span>
        <span style="font-size:.62rem;color:var(--muted)">${sc} scoped</span>
      </div>
    </div>`;
  }).join('');
}

  document.getElementById('work-area').innerHTML=`

        <div class="jb-title" style="display:flex;align-items:center;gap:8px">

          ${j.jobType?jtBadge(j.jobType,false):''}
        </div>
        <div class="jb-meta">${e(j.customer)||'—'} | Tag: ${e(j.tag)||'—'} | ${e(j.size)||'—'} | ${e(j.material)||'—'}</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="window.print()">🖨 Print ITP</button>

// ════════════════════════════════════════
// LEFT PANEL
// ════════════════════════════════════════
function buildItemHtml(it, itemId, isCustom){
  const j=J();
  const sel=getSel(j,itemId);
  const inc=sel.included;
  let attrBar='', subReqArea='';

  if(inc){
    const tog=(cls,flag,label,emoji)=>`
      <span class="attr-toggle ${cls}${sel[flag]?' on':''}"
        onclick="event.stopPropagation();toggleAttr('${itemId}','${flag}')">
        <span class="atcb"></span>${emoji} ${label}
      </span>`;
    attrBar=`<div class="attr-bar">
      ${tog('hp','holdPoint','Hold Point','🔴')}
      ${tog('bef','beforeMeas','Before Meas.','📏')}
      ${tog('aft','afterMeas','After Meas.','📐')}
      ${tog('ver','measVerify','Meas. Verify','✔️')}
    </div>`;
    const srRows=(sel.subReqs||[]).map((sr,idx)=>`
      <div class="sub-req-row">
        <span>• ${e(sr)}</span>
        <button class="sr-del" onclick="event.stopPropagation();removeSubReq('${itemId}',${idx})">✕</button>
      </div>`).join('');
    subReqArea=`<div class="sub-reqs-area">
      ${srRows}
      <div class="add-sr-row">
        <input class="add-sr-inp" id="sr-${itemId}" type="text" placeholder="+ Add sub-requirement…"
          onkeydown="if(event.key==='Enter'){event.preventDefault();addSubReq('${itemId}',this)}"/>
        <button class="add-sr-btn" onclick="event.stopPropagation();addSubReq('${itemId}',document.getElementById('sr-${itemId}'))">Add</button>
      </div>
    </div>`;
  }

  const nameLine=isCustom
    ?`${e(it.name)} <span style="font-size:.61rem;color:var(--muted)">(custom)</span>`
    :e(it.name);
  const refLine=isCustom
    ?`Custom · <span style="cursor:pointer;color:var(--fail)" onclick="event.stopPropagation();removeCustomItem('${itemId}')">remove</span>`
    :e(it.ref);

  return `<div class="lib-item${inc?' sel':''}">
    <div class="lib-item-top" onclick="toggleInclude('${itemId}')">
      <div class="cb-cell"><span class="cb"></span></div>
      <div class="lib-item-name">
        <div class="lin">${nameLine}</div>
        <div class="lref">${refLine}</div>
      </div>
    </div>
    ${attrBar}${subReqArea}
  </div>`;
}

function renderLeft(){
  const j=J();
  const sc=scopeCount(j);

  const secs=LIB.map((sec,si)=>{
    const selCount=sec.items.filter(it=>isIncluded(j,it.id)).length
      +(j.custom||[]).filter(c=>c.secId===sec.id).length;
    const allSel=sec.items.length>0&&sec.items.every(it=>isIncluded(j,it.id));

    const rows=sec.items.map(it=>buildItemHtml(it,it.id,false)).join('');
    const customs=(j.custom||[]).filter(c=>c.secId===sec.id)
      .map(c=>buildItemHtml(c,c.id,true)).join('');

    return `<div class="lib-sec">
      <div class="lib-sec-hdr">
        <h4>${e(sec.title)}</h4>
        <div class="lshr">
          <span>${selCount}/${sec.items.length+(j.custom||[]).filter(c=>c.secId===sec.id).length}</span>
          <button class="sel-all" onclick="event.stopPropagation();selectAll('${sec.id}',${!allSel})">${allSel?'Deselect All':'Select All'}</button>
        </div>
      </div>
      ${rows}${customs}
      <div class="add-row">
        <input class="add-inp" id="ai-${si}" type="text" placeholder="+ Add custom item…"
          onkeydown="if(event.key==='Enter'){addCustomItem('${sec.id}',${si});event.preventDefault()}"/>
        <button class="add-btn" onclick="addCustomItem('${sec.id}',${si})">Add</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('panel-left').innerHTML=`
    <div class="panel-hdr">
      <h3>📋 Build Scope</h3>
      <span class="ph-count">${sc} selected</span>
    </div>
    <div class="panel-body">${secs}</div>`;
}

  const sectHtml=LIB.map(sec=>{
    const grp=bySection[sec.id];
    if(!grp||!grp.items.length) return '';
    const secDone=grp.items.filter(it=>getExec(j,it.id).done).length;
    const secFlag=grp.items.filter(it=>getExec(j,it.id).flagged).length;

    const rows=grp.items.map(it=>{
      const ex=getExec(j,it.id);
      const sel=getSel(j,it.id);

      let badges='';
      if(sel.holdPoint) badges+=`<span class="hp-badge">🔴 HOLD POINT</span>`;
      if(sel.beforeMeas) badges+=`<span class="attr-badge bef">📏 Before</span>`;
      if(sel.afterMeas)  badges+=`<span class="attr-badge aft">📐 After</span>`;
      if(sel.measVerify) badges+=`<span class="attr-badge ver">✔️ Verify</span>`;

      let measHtml='';
      const hasBefore=sel.beforeMeas, hasAfter=sel.afterMeas, hasVerify=sel.measVerify;
      if(hasBefore||hasAfter||hasVerify){
        const fields=[];

        if(hasAfter) fields.push(`<div class="mf-wrap"><label>After Measurement</label>

        if(hasVerify) fields.push(`<div class="mf-wrap"><label>Verification / Acceptance</label>
          <input class="meas-inp verify" type="text" value="${e(ex.verifyVal||'')}" placeholder="Spec / result"
            onchange="setExecField('${it.id}','verifyVal',this.value)"/></div>`);
        measHtml=`<div class="meas-fields${fields.length===1?' one':''}">${fields.join('')}</div>`;
      }

      let srHtml='';
      if((sel.subReqs||[]).length){
        srHtml=`<div class="exec-subreqs">`
          +(sel.subReqs||[]).map((sr,idx)=>{
            const done=!!(ex.subDone||{})[idx];
            return `<div class="exec-sr-row">
              <span class="srcb" style="width:14px;height:14px;border-radius:3px;border:1.5px solid ${done?'var(--pass)':'var(--border)'};display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:${done?'var(--pass)':'#fff'};flex-shrink:0"
                onclick="toggleSubDone('${it.id}',${idx})">${done?'<span style="color:#fff;font-size:.65rem;font-weight:700">✓</span>':''}</span>
              <span class="${done?'done-text':''}">• ${e(sr)}</span>
            </div>`;
          }).join('')
          +`</div>`;
      }

      const hpClass=sel.holdPoint?' hold-point':'';
      return `${sel.holdPoint?'<div class="hp-divider">QA/QC HOLD POINT — Inspector sign-off required before proceeding</div>':''}
        <div class="exec-row${ex.done?' done':''}${ex.flagged?' flagged':''}${hpClass}">
          <div class="exec-top">
            <div class="exec-cb" onclick="toggleDone('${it.id}')">
              <span class="cb${ex.done?' sel':''}"></span>
            </div>
            <div class="exec-body">
              <div class="en">${e(it.name)} ${badges}</div>
              <div class="er">[${e(it.ref)}]</div>
              ${measHtml}

            </div>

              <button class="rm-btn" title="Remove from ITP" onclick="removeScope('${it.id}')">✕</button>
            </div>
          </div>
          ${srHtml}
        </div>`;
    }).join('');

    return `<div class="itp-sec">
      <div class="itp-sec-hdr">
        <h4>${e(sec.title)}</h4>
        <div style="display:flex;align-items:center;gap:5px">
          ${secFlag?`<span style="font-size:.63rem;background:var(--fail);color:#fff;border-radius:20px;padding:1px 5px">⚑${secFlag}</span>`:''}
          <span class="isp">${secDone}/${grp.items.length}</span>
        </div>
      </div>
      ${rows}
    </div>`;
  }).join('');

  // job details
  const vtOpts=VALVE_TYPES.map(vt=>`<option ${(j.valveType||j.type)===vt?'selected':''}>${e(vt)}</option>`).join('');
  const details=`<div class="job-details">
    <div class="jd-hdr" onclick="toggleDetails(this)">▾ Job Details</div>
    <div id="jd-body">
      <div class="jd-grid">
        <div class="jdf"><label>Work Order #</label><input value="${e(j.wo)}" onchange="upf('wo',this.value)"/></div>
        <div class="jdf"><label>Date</label><input type="date" value="${j.date}" onchange="upf('date',this.value)"/></div>
        <div class="jdf"><label>Customer</label><input value="${e(j.customer)}" onchange="upf('customer',this.value)"/></div>
        <div class="jdf"><label>PO</label><input value="${e(j.po)}" onchange="upf('po',this.value)"/></div>
        <div class="jdf"><label>Tag</label><input value="${e(j.tag)}" onchange="upf('tag',this.value)"/></div>
        <div class="jdf"><label>Job Type</label>
          <select onchange="upf('jobType',this.value)">
            <option value="">— Select —</option>
            <option ${j.jobType==='repair'?'selected':''} value="repair">Repair</option>
            <option ${j.jobType==='testonly'?'selected':''} value="testonly">Test Only</option>
            <option ${j.jobType==='manufacturing'?'selected':''} value="manufacturing">Manufacturing</option>
            <option ${j.jobType==='other'?'selected':''} value="other">Other</option>
          </select>
        </div>
        <div class="jdf"><label>Valve Type</label>
          <select onchange="upf('valveType',this.value)">
            <option value="">— Select —</option>
            ${vtOpts}
          </select>
        </div>
        <div class="jdf"><label>Size / Class</label><input value="${e(j.size)}" onchange="upf('size',this.value)"/></div>
        <div class="jdf"><label>Material</label><input value="${e(j.material)}" onchange="upf('material',this.value)"/></div>
        <div class="jdf s2"><label>Scope Notes</label><textarea rows="2" onchange="upf('scope',this.value)">${e(j.scope)}</textarea></div>
      </div>
    </div>
  </div>`;

  const signoff=`<div class="signoff">
    <h4>QC Sign-Off</h4>
    <div class="so-grid">
      <div class="sof"><label>Inspector</label><input value="${e(j.inspector)}" onchange="upf('inspector',this.value)" placeholder="Print name"/></div>
      <div class="sof"><label>Inspection Date</label><input type="date" value="${j.inspDate}" onchange="upf('inspDate',this.value)"/></div>
      <div class="sof"><label>QC Manager</label><input value="${e(j.qcMgr)}" onchange="upf('qcMgr',this.value)" placeholder="Print name"/></div>
      <div class="sof"><label>Review Date</label><input type="date" value="${j.qcDate}" onchange="upf('qcDate',this.value)"/></div>
    </div>
    <div style="margin-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:8px;border-top:1px solid var(--border)">
      <div><div style="font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">Inspector Signature</div><div class="sig-line"></div></div>
      <div><div style="font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">QC Manager Signature</div><div class="sig-line"></div></div>
    </div>
    <div style="margin-top:8px;font-size:.68rem;color:var(--muted)">
      Environmental Fittings · mike@envfittings.com · ITP Rev 1.0
      &nbsp;|&nbsp; <strong>Overall:</strong> <span style="color:${pctColor};font-weight:700">${overallLabel}</span>
    </div>
  </div>`;

  document.getElementById('panel-right').innerHTML=`
    <div class="panel-hdr" style="flex-shrink:0">
      <h3>✅ ITP Checklist</h3>
      <span class="ph-count" style="color:${pctColor}">${es.done}/${es.total} · ${es.pct}%</span>
    </div>
    <div class="itp-summary" style="flex-shrink:0">
      <div class="ss"><div class="sv">${es.total}</div><div class="sl">Items</div></div>
      <div class="ss"><div class="sv c-pass">${es.done}</div><div class="sl">Done</div></div>
      <div class="ss"><div class="sv c-fail">${es.flagged}</div><div class="sl">Flagged</div></div>
      <div class="ss"><div class="sv c-hp">${es.holdPts}</div><div class="sl">Hold Pts</div></div>

function toggleDetails(h){
  const b=document.getElementById('jd-body'); if(!b) return;
  const hidden=b.style.display==='none';
  b.style.display=hidden?'':'none';
  h.textContent=(hidden?'▾':'▸')+' Job Details';
}

// ════════════════════════════════════════
// ACTIONS — SCOPE BUILDER
// ════════════════════════════════════════
function toggleInclude(itemId){
  const j=J();
  const wasNew=!j.sel[itemId];
  if(!j.sel[itemId]) j.sel[itemId]=defSel();
  j.sel[itemId].included=!j.sel[itemId].included;
  if(j.sel[itemId].included&&wasNew){
    let libItem=null;
    LIB.forEach(sec=>sec.items.forEach(it=>{ if(it.id===itemId) libItem=it; }));
    if(libItem&&libItem.defaultSubReqs&&j.sel[itemId].subReqs.length===0){
      j.sel[itemId].subReqs=[...libItem.defaultSubReqs];
    }
  }
  save(); renderLeft(); renderRight();
}

function toggleAttr(itemId,attr){
  const j=J();
  if(!j.sel[itemId]) j.sel[itemId]=defSel();
  j.sel[itemId][attr]=!j.sel[itemId][attr];
  save(); renderLeft(); renderRight();
}

function selectAll(secId,inc){
  const j=J();
  LIB.find(s=>s.id===secId).items.forEach(it=>{
    if(!j.sel[it.id]) j.sel[it.id]=defSel();
    j.sel[it.id].included=inc;
    if(inc){
      let libItem=LIB.flatMap(s=>s.items).find(x=>x.id===it.id);
      if(libItem&&libItem.defaultSubReqs&&j.sel[it.id].subReqs.length===0){
        j.sel[it.id].subReqs=[...libItem.defaultSubReqs];
      }
    }
  });
  save(); renderLeft(); renderRight();
}

function addCustomItem(secId,si){
  const inp=document.getElementById('ai-'+si);
  const text=(inp?.value||'').trim(); if(!text) return;
  const j=J();
  const cid='c'+Date.now();
  j.custom.push({id:cid,secId,name:text});
  j.sel[cid]={...defSel(),included:true};
  save(); renderLeft(); renderRight();
}

function removeCustomItem(cid){
  const j=J();
  j.custom=j.custom.filter(c=>c.id!==cid);
  delete j.sel[cid]; delete j.exec[cid];
  save(); renderLeft(); renderRight();
}

function addSubReq(itemId,inp){
  const text=(inp?.value||'').trim(); if(!text) return;
  const j=J();
  if(!j.sel[itemId]) j.sel[itemId]=defSel();
  j.sel[itemId].subReqs.push(text);
  inp.value=''; save(); renderLeft(); renderRight();
}

function removeSubReq(itemId,idx){
  const j=J();
  if(!j.sel[itemId]) return;
  j.sel[itemId].subReqs.splice(idx,1);
  save(); renderLeft(); renderRight();
}

// ════════════════════════════════════════
// ACTIONS — ITP EXEC
// ════════════════════════════════════════
function ensureExec(j,id){ if(!j.exec[id]) j.exec[id]={done:false,flagged:false,notes:'',beforeVal:'',afterVal:'',verifyVal:'',subDone:{}}; }

function toggleDone(itemId){
  const j=J(); ensureExec(j,itemId);
  j.exec[itemId].done=!j.exec[itemId].done;
  save(); renderRight(); renderSidebar();
}

function toggleFlag(itemId){
  const j=J(); ensureExec(j,itemId);
  j.exec[itemId].flagged=!j.exec[itemId].flagged;
  save(); renderRight(); renderSidebar();
}

function setExecField(itemId,field,val){
  const j=J(); ensureExec(j,itemId);
  j.exec[itemId][field]=val; save();
}

function toggleSubDone(itemId,idx){
  const j=J(); ensureExec(j,itemId);
  if(!j.exec[itemId].subDone) j.exec[itemId].subDone={};
  j.exec[itemId].subDone[idx]=!j.exec[itemId].subDone[idx];
  save(); renderRight();
}

function removeScope(itemId){
  const j=J();
  if(j.sel[itemId]) j.sel[itemId].included=false;
  j.custom=j.custom.filter(c=>c.id!==itemId);
  save(); renderLeft(); renderRight();
}

function upf(field,val){ const j=J(); j[field]=val; save(); renderSidebar(); }

function deleteJob(){
  if(!confirm('Delete this work order?')) return;
  jobs=jobs.filter(j=>j.id!==active); active=null; save(); renderSidebar();
  document.getElementById('work-area').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:center;flex:1;color:var(--muted);flex-direction:column;gap:10px">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".22">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/>
      </svg>
      <p style="font-size:.88rem">Select or create a work order.</p>
    </div>`;
}

// ════════════════════════════════════════
// UTILS
// ════════════════════════════════════════
function e(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
renderSidebar();
if(jobs.length) loadJob(jobs[0].id);
</script>
